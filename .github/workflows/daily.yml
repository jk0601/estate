# 매일아침.bat 와 동일: watch + radar 수집 → docs/*.json 커밋 → push
# 스케줄: 매일 08:00 KST (= 23:00 UTC)
name: Daily update

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:  # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run watch/scrape.py
        id: watch
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python watch/scrape.py

      - name: Run radar.py
        id: radar
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python radar.py

      - name: Commit and push
        env:
          FAIL_WATCH: ${{ steps.watch.outcome }}
          FAIL_RADAR: ${{ steps.radar.outcome }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/watch_data.json docs/radar_data.json docs/data.json
          if git diff --cached --quiet; then
            echo "nothing changed - skipping commit"
          else
            git commit -m "daily update: watch + radar"
            git pull --rebase origin HEAD || true
            git push
          fi

          if [ "$FAIL_WATCH" != "success" ]; then
            echo "::warning::watch/scrape.py FAILED"
          fi
          if [ "$FAIL_RADAR" != "success" ]; then
            echo "::warning::radar.py FAILED"
          fi
          # 둘 다 실패하면 job 실패로 표시 (알림용)
          if [ "$FAIL_WATCH" != "success" ] && [ "$FAIL_RADAR" != "success" ]; then
            exit 1
          fi
