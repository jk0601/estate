<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>서울 입주예정 단지 · 2026 하반기</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1a1d21; --sub:#6b7280; --line:#e5e7eb;
    --brand:#1f6feb; --brand-ink:#fff; --chip:#eef1f5; --chip-on:#1f6feb;
    --sale:#0a7f4f; --rent:#8a5a00; --sale-bg:#e7f6ee; --rent-bg:#fbf1dd;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --card:#171b22; --ink:#e6e8eb; --sub:#9aa4b2; --line:#262c36;
      --brand:#4d8bff; --chip:#20262f; --chip-on:#4d8bff;
      --sale:#4ade80; --rent:#e0b25a; --sale-bg:#12251b; --rent-bg:#2a2110;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",
      "Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
    -webkit-text-size-adjust:100%;
  }
  header{
    padding:16px 16px 10px; max-width:760px; margin:0 auto;
  }
  h1{font-size:19px; margin:0 0 3px; letter-spacing:-.02em}
  .meta{font-size:12.5px; color:var(--sub)}
  .toolbar{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:8px 16px 10px; max-width:760px; margin:0 auto;
    border-bottom:1px solid var(--line);
  }
  .row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:7px}
  .row:last-child{margin-bottom:0}
  input[type=search]{
    width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line);
    border-radius:10px; background:var(--card); color:var(--ink);
  }
  .chip{
    font-size:13px; padding:6px 11px; border-radius:999px; border:1px solid var(--line);
    background:var(--chip); color:var(--ink); cursor:pointer; user-select:none; white-space:nowrap;
  }
  .chip.on{background:var(--chip-on); color:#fff; border-color:var(--chip-on)}
  select{
    font-size:13px; padding:6px 10px; border-radius:999px; border:1px solid var(--line);
    background:var(--chip); color:var(--ink);
  }
  main{max-width:760px; margin:0 auto; padding:12px 16px 40px}
  .count{font-size:13px; color:var(--sub); margin:2px 2px 10px}
  .grid{display:grid; grid-template-columns:1fr; gap:10px}
  @media (min-width:620px){ .grid{grid-template-columns:1fr 1fr} }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; box-shadow:var(--shadow);
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .name{font-size:16px; font-weight:700; letter-spacing:-.01em; margin:0}
  .badge{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap}
  .badge.sale{background:var(--sale-bg); color:var(--sale)}
  .badge.rent{background:var(--rent-bg); color:var(--rent)}
  .addr{font-size:12.5px; color:var(--sub); margin:5px 0 10px; word-break:keep-all}
  .price{font-size:15px; margin:2px 0 10px}
  .price .k{color:var(--sub); font-size:12px; margin-right:5px}
  .price b{color:var(--brand); font-weight:800; letter-spacing:-.01em}
  .jeonse{font-size:14px; margin:-4px 0 10px}
  .jeonse .k{color:var(--sub); font-size:12px; margin-right:5px}
  .jeonse b{font-weight:700}
  .ratio{font-size:11px; font-weight:700; color:var(--sale); background:var(--sale-bg);
    padding:2px 7px; border-radius:999px; margin-left:6px}
  .facts{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; margin-bottom:12px}
  .facts b{font-weight:700}
  .facts .k{color:var(--sub); font-weight:400; margin-right:4px}
  .naver{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    background:#03c75a; color:#fff; font-size:13.5px; font-weight:700;
    padding:9px 12px; border-radius:10px; width:100%; justify-content:center;
  }
  .naver:active{opacity:.85}
  .notice{display:block; text-align:center; text-decoration:none; margin-top:7px;
    font-size:12.5px; color:var(--sub); border:1px solid var(--line); border-radius:9px; padding:7px}
  .notice:active{opacity:.7}
  .jinput{display:flex; align-items:center; gap:8px; margin-top:9px;
    padding-top:9px; border-top:1px dashed var(--line)}
  .jinput span{font-size:12px; color:var(--sub); white-space:nowrap}
  .jinput input{flex:1; min-width:0; font-size:14px; padding:8px 10px;
    border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink)}
  .share{display:flex; gap:8px; margin:0 auto 24px; max-width:760px; padding:0 16px}
  .share button{flex:1; font-size:12.5px; padding:9px; border-radius:9px;
    border:1px solid var(--line); background:var(--card); color:var(--ink)}
  .share button:active{opacity:.7}
  .empty{text-align:center; color:var(--sub); padding:50px 0; font-size:14px}
  footer{max-width:760px; margin:0 auto; padding:0 16px 40px; color:var(--sub); font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1>서울 입주예정 단지 · 2026 하반기</h1>
  <div class="meta" id="meta">불러오는 중…</div>
</header>

<div class="toolbar">
  <div class="row"><input type="search" id="q" placeholder="단지명·지역 검색" /></div>
  <div class="row" id="months"></div>
  <div class="row" id="gus"></div>
  <div class="row" id="budgets"></div>
  <div class="row">
    <span class="chip type on" data-type="all">전체</span>
    <span class="chip type" data-type="분양">분양</span>
    <span class="chip type" data-type="임대">임대</span>
    <select id="sort">
      <option value="move_in">입주 빠른순</option>
      <option value="price_asc">분양가 낮은순</option>
      <option value="price_desc">분양가 높은순</option>
      <option value="jeonse_asc">전세 낮은순</option>
      <option value="ratio_desc">전세가율 높은순</option>
      <option value="households">세대 많은순</option>
      <option value="gu">지역순</option>
    </select>
  </div>
</div>

<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>조건에 맞는 단지가 없습니다.</div>
</main>

<div class="share">
  <button id="jexport">전세가 내보내기(공유)</button>
  <button id="jimport">전세가 가져오기</button>
</div>
<footer id="foot"></footer>

<script>
const state = { all: [], type: "all", month: "all", gu: "all", budget: "all", q: "", sort: "move_in" };

// 만원 -> "12.3억" (분양가 표시용)
function eok(man){
  if(man==null) return null;
  const v = man/10000;
  return (v>=100 ? Math.round(v) : v.toFixed(1)) + "억";
}
// 예산 필터 구간(만원). 분양 최저가(bunyang_price_min) 기준.
const BUDGETS = [
  {key:"all",   label:"전체 금액", max:Infinity},
  {key:"b6",    label:"6억↓",  max:60000},
  {key:"b9",    label:"9억↓",  max:90000},
  {key:"b15",   label:"15억↓", max:150000},
  {key:"b15up", label:"15억↑", min:150000, max:Infinity},
];

// 전세가는 자동수집 불가 → 카드에서 직접 입력한 값을 브라우저(localStorage)에 저장.
const JKEY = "estate_jeonse_v1";
let jstore = {};
try { jstore = JSON.parse(localStorage.getItem(JKEY) || "{}"); } catch(e) { jstore = {}; }
function saveJeonse(){ try { localStorage.setItem(JKEY, JSON.stringify(jstore)); } catch(e){} }
// 입력값(우선) 또는 data.json의 값
function effLow(x){
  const v = jstore[x.name] && jstore[x.name].low;
  return (v!=null && v!=="") ? Number(v) : (x.jeonse_low!=null ? x.jeonse_low : null);
}
function effRatio(x){
  const lo = effLow(x), base = x.bunyang_price_min;
  return (lo!=null && base) ? Math.round(lo/base*100) : null;
}

function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

function chip(label, val, group){
  const c = el("span","chip",label); c.dataset.val=val; c.dataset.group=group;
  if(val==="all") c.classList.add("on");
  c.addEventListener("click", ()=>{
    document.querySelectorAll(`.chip[data-group="${group}"]`).forEach(x=>x.classList.remove("on"));
    c.classList.add("on");
    if(group==="month") state.month=val;
    else if(group==="gu") state.gu=val;
    else if(group==="budget") state.budget=val;
    render();
  });
  return c;
}

function fmtMonth(m){ return m.replace("-", ". ") + "월"; } // 2026-08 -> 2026. 08월

function passes(x){
  if(state.type!=="all" && x.supply_type!==state.type) return false;
  if(state.month!=="all" && x.move_in!==state.month) return false;
  if(state.gu!=="all" && x.gu!==state.gu) return false;
  if(state.budget!=="all"){
    const b = BUDGETS.find(z=>z.key===state.budget);
    const p = x.bunyang_price_min;
    if(p==null) return false;                       // 분양가 없는 건 예산필터 시 제외
    if(b.min!=null && p < b.min) return false;
    if(p > b.max) return false;
  }
  if(state.q){ const s=(x.name+" "+x.address+" "+x.gu).toLowerCase(); if(!s.includes(state.q.toLowerCase())) return false; }
  return true;
}

function render(){
  let rows = state.all.filter(passes);
  const s = state.sort;
  const pmin = x => (x.bunyang_price_min==null ? Infinity : x.bunyang_price_min);
  const jlow = x => { const v=effLow(x);   return v==null ? Infinity : v; };  // 값 없으면 뒤로
  const jrat = x => { const v=effRatio(x); return v==null ? -1 : v; };        // 값 없으면 뒤로
  rows.sort((a,b)=>{
    if(s==="households") return b.households-a.households;
    if(s==="gu") return a.gu.localeCompare(b.gu,"ko") || a.move_in.localeCompare(b.move_in);
    if(s==="price_asc")  return pmin(a)-pmin(b);
    if(s==="price_desc") return (pmin(b)===Infinity?-1:pmin(b)) - (pmin(a)===Infinity?-1:pmin(a));
    if(s==="jeonse_asc") return jlow(a)-jlow(b);
    if(s==="ratio_desc") return jrat(b)-jrat(a);
    return a.move_in.localeCompare(b.move_in) || b.households-a.households; // move_in
  });

  const grid=document.getElementById("grid"); grid.innerHTML="";
  document.getElementById("empty").hidden = rows.length>0;
  document.getElementById("count").textContent = `${rows.length}개 단지`;

  for(const x of rows){
    const card=el("div","card");
    const top=el("div","card-top");
    top.appendChild(el("p","name",x.name));
    const isSale = x.supply_type==="분양";
    top.appendChild(el("span","badge "+(isSale?"sale":"rent"), x.supply_type));
    card.appendChild(top);

    card.appendChild(el("div","addr", x.address));

    // 분양가 라인 (있을 때만)
    const lo=x.bunyang_price_min, hi=x.bunyang_price_max;
    if(lo!=null){
      const p=el("div","price");
      const range = (hi && hi!==lo) ? `${eok(lo)} ~ ${eok(hi)}` : eok(lo);
      p.innerHTML = `<span class="k">분양가</span> <b>${range}</b>`;
      card.appendChild(p);
    }

    // 전세가 / 전세가율 (카드에서 직접 입력한 값 기준)
    const elow=effLow(x), erat=effRatio(x);
    if(elow!=null){
      const j=el("div","jeonse");
      let html=`<span class="k">전세</span> <b>${eok(elow)}</b>`;
      if(erat!=null) html+=` <span class="ratio">전세가율 ${erat}%</span>`;
      j.innerHTML=html;
      card.appendChild(j);
    }

    const facts=el("div","facts");
    const f1=el("span"); f1.innerHTML=`<span class="k">입주</span><b>${fmtMonth(x.move_in)}</b>`;
    const f2=el("span"); f2.innerHTML=`<span class="k">세대</span><b>${x.households.toLocaleString()}</b>`;
    const f3=el("span"); f3.innerHTML=`<span class="k">지역</span><b>${x.gu}</b>`;
    facts.append(f1,f2,f3);
    card.appendChild(facts);

    const a=el("a","naver", (x.naver_complex_no ? "이 단지 전세·매물 보기 →" : "네이버에서 검색 →"));
    a.href=x.naver_url; a.target="_blank"; a.rel="noopener";
    card.appendChild(a);

    // 청약홈 공고 홈페이지 (있을 때만)
    if(x.pblanc && x.pblanc.homepage){
      const g=el("a","notice","분양 공고 홈페이지");
      g.href=x.pblanc.homepage; g.target="_blank"; g.rel="noopener";
      card.appendChild(g);
    }

    // 전세가 직접 입력 (브라우저 저장) → 전세가율 자동
    const jin=el("label","jinput");
    jin.appendChild(el("span",null,"전세 최저가 입력"));
    const inp=el("input"); inp.type="number"; inp.inputMode="numeric";
    inp.placeholder="만원 (예: 55000 = 5.5억)";
    const cur = jstore[x.name] && jstore[x.name].low;
    if(cur!=null && cur!=="") inp.value=cur;
    const commit=()=>{
      const v=inp.value.trim();
      if(v==="") delete jstore[x.name]; else jstore[x.name]={low:Number(v)};
      saveJeonse(); render();
    };
    inp.addEventListener("change", commit);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") inp.blur(); });
    jin.appendChild(inp);
    card.appendChild(jin);

    grid.appendChild(card);
  }
}

async function boot(){
  try{
    const res = await fetch("./data.json?_="+Date.now());
    const data = await res.json();
    state.all = data.complexes || [];

    document.getElementById("meta").textContent =
      `${data.source} · 총 ${data.count}개 · 갱신 ${data.generated_at}`;
    document.getElementById("foot").innerHTML =
      "사용법: 카드의 '전세·매물 보기'로 현재 전세 호가를 확인해 '전세 최저가 입력'에 적으면 " +
      "전세가율이 자동 계산되고, '전세가율 높은순/전세 낮은순'으로 정렬됩니다. " +
      "입력값은 이 브라우저에 저장되며, 다른 가족과는 '내보내기/가져오기'로 공유하세요.<br>" +
      "출처: 청약홈(한국부동산원) 입주예정·분양정보. 참고용이며 계약 전 현장·공고를 반드시 확인하세요.";

    // 월 칩
    const mwrap=document.getElementById("months");
    mwrap.appendChild(chip("전체 월","all","month"));
    (data.months||[]).forEach(m=> mwrap.appendChild(chip(fmtMonth(m), m, "month")));

    // 구 칩
    const gus=[...new Set(state.all.map(x=>x.gu).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
    const gwrap=document.getElementById("gus");
    gwrap.appendChild(chip("전체 지역","all","gu"));
    gus.forEach(g=> gwrap.appendChild(chip(g,g,"gu")));

    // 예산(분양가) 칩
    const bwrap=document.getElementById("budgets");
    BUDGETS.forEach(b=> bwrap.appendChild(chip(b.label, b.key, "budget")));

    render();
  }catch(e){
    document.getElementById("meta").textContent="데이터를 불러오지 못했습니다: "+e;
  }
}

document.querySelectorAll(".chip.type").forEach(c=>{
  c.addEventListener("click", ()=>{
    document.querySelectorAll(".chip.type").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); state.type=c.dataset.type; render();
  });
});
document.getElementById("q").addEventListener("input", e=>{ state.q=e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e=>{ state.sort=e.target.value; render(); });

// 전세가 공유(기기 간): 내보내기=클립보드 복사, 가져오기=붙여넣기 병합
document.getElementById("jexport").addEventListener("click", async ()=>{
  const txt=JSON.stringify(jstore);
  if(Object.keys(jstore).length===0){ alert("입력된 전세가가 없습니다."); return; }
  try{ await navigator.clipboard.writeText(txt); alert("전세가 데이터를 복사했습니다.\n가족에게 전달 후 '가져오기'로 붙여넣게 하세요."); }
  catch(e){ prompt("아래 내용을 복사해 전달하세요:", txt); }
});
document.getElementById("jimport").addEventListener("click", ()=>{
  const txt=prompt("전달받은 전세가 데이터를 붙여넣으세요:");
  if(!txt) return;
  try{ Object.assign(jstore, JSON.parse(txt)); saveJeonse(); render(); alert("가져왔습니다."); }
  catch(e){ alert("형식이 올바르지 않습니다."); }
});

boot();
</script>
</body>
</html>
